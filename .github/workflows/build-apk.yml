name: Build APK

on:
  push:
    branches:
      - claude/android-photo-analysis-bx5s4i
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PCLAUDE_API_KEY="${{ secrets.CLAUDE_API_KEY }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: formchecker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create / update Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "FormChecker (debug APK)"
          body: |
            帳票チェッカー - debug APK tự động build.
            Tải file `app-debug.apk` bên dưới và cài lên thiết bị Android
            (bật "Cài đặt từ nguồn không xác định").

            Hai chế độ AI:
            - 🧠 On-device (Gemma 3n) — offline, không cần API key.
              Cần import file model .task trong app (nút "AIモデルを管理").
            - ☁ Cloud (Claude) — chính xác hơn, cần build kèm CLAUDE_API_KEY.

            Bản build này không kèm API key; mặc định dùng engine on-device.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
